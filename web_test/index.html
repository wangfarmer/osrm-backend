const start = [-77.63219780265017, 38.80101579506264];
const end = [-77.636930, 38.804120];

const map = L.map("map").setView([38.8025, -77.6345], 17);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution: "&copy; OpenStreetMap contributors",
    maxZoom: 19
  }
).addTo(map);

L.marker([start[1], start[0]])
  .addTo(map)
  .bindPopup("Start");

L.marker([end[1], end[0]])
  .addTo(map)
  .bindPopup("End");
//`${start[0]},${start[1]};${mid1[0]},${mid1[1]};${mid2[0]},${mid2[1]};${end[0]},${end[1]}` +
async function loadRoute() {
  const url =
  "/osrm/route/v1/driving/" +
  `${start[0]},${start[1]};${end[0]},${end[1]}` +
  "?steps=true&geometries=geojson&overview=full" +
  "&street_names=Early_Marker_Court;Gaffney_Circle";

  const response = await fetch(url);
  const data = await response.json();

  console.log(data);

  if (data.code !== "Ok") {
    document.getElementById("status").innerText =
      "OSRM error: " + JSON.stringify(data, null, 2);
    return;
  }

  const route = data.routes[0];

  L.geoJSON(route.geometry, {
    weight: 6
  }).addTo(map);

  const bounds = L.geoJSON(route.geometry).getBounds();
  map.fitBounds(bounds, { padding: [40, 40] });

  let uturns = [];

  route.legs.forEach((leg) => {
    leg.steps.forEach((step) => {
      const maneuver = step.maneuver;

      if (maneuver && maneuver.modifier === "uturn") {
        uturns.push({
          location: maneuver.location,
          name: step.name,
          type: maneuver.type,
          modifier: maneuver.modifier
        });

        L.circleMarker(
          [maneuver.location[1], maneuver.location[0]],
          {
            radius: 10,
            weight: 3
          }
        )
        .addTo(map)
        .bindPopup(
          "U-turn detected<br>" +
          "Road: " + step.name + "<br>" +
          "Type: " + maneuver.type + "<br>" +
          "Modifier: " + maneuver.modifier
        );
      }
    });
  });

  document.getElementById("status").innerText =
    `Distance: ${route.distance.toFixed(1)} m\n` +
    `Duration: ${route.duration.toFixed(1)} s\n` +
    `U-turn count: ${uturns.length}\n\n` +
    uturns.map((u, i) =>
      `#${i + 1}: ${u.name || "(unnamed road)"} at ${u.location[0]}, ${u.location[1]}`
    ).join("\n");
}

loadRoute();
